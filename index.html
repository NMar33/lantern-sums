<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Sums</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky"></canvas>

  <header class="hud">
    <div class="hud-score">Score <span id="score">0</span></div>
    <div class="hud-target">Target <span id="target">10</span></div>
    <div class="hud-lives" id="lives" aria-label="3 lives left"></div>
  </header>

  <div class="overlay" id="start-overlay">
    <div class="panel">
      <h1>Lantern Sums</h1>
      <button type="button" id="start-button">Start</button>
    </div>
  </div>

  <div class="overlay" id="pause-overlay" hidden>
    <div class="panel">
      <h2>Paused</h2>
      <p class="hint">Press Space to continue</p>
    </div>
  </div>

  <div class="overlay" id="gameover-overlay" hidden>
    <div class="panel">
      <h2>Game over</h2>
      <p class="result">Score <span id="final-score">0</span></p>
      <p class="result">Best <span id="best-score">0</span></p>
      <button type="button" id="again-button">Play again</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
