<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Sums</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky"></canvas>

  <header class="hud">
    <div class="hud-score">Score <span id="score">0</span></div>
    <div class="hud-target">Target <span id="target">10</span></div>
    <div class="hud-lives" id="lives" aria-label="3 lives left"></div>
    <div class="hud-level">
      <span class="hud-level-name">Level <span id="level">1</span></span>
      <div class="hud-progress" role="progressbar" aria-label="Points toward the next level"
           aria-valuemin="0" aria-valuemax="200" aria-valuenow="0">
        <div class="hud-progress-fill" id="progress-fill"></div>
        <span class="hud-progress-mark" style="left: 50%"><span>100</span></span>
        <span class="hud-progress-mark" style="left: 100%"><span>200</span></span>
      </div>
    </div>
  </header>

  <div class="overlay" id="start-overlay">
    <div class="panel">
      <h1 id="title">Lantern Sums</h1>
      <p class="hint start-level" id="start-level" hidden></p>
      <div class="start-row">
        <button type="button" id="start-button">Start</button>
        <button type="button" id="halloween-toggle" class="toggle" role="switch" aria-checked="false">
          <span class="toggle-track" aria-hidden="true"><span class="toggle-knob"></span></span>
          Halloween
        </button>
      </div>
    </div>
  </div>

  <div class="overlay" id="pause-overlay" hidden>
    <div class="panel">
      <h2>Paused</h2>
      <p class="hint">Press Space to continue</p>
    </div>
  </div>

  <div class="overlay" id="gameover-overlay" hidden>
    <div class="panel">
      <h2>Game over</h2>
      <p class="result">Level <span id="final-level">1</span></p>
      <p class="result">Score <span id="final-score">0</span></p>
      <p class="result">Best <span id="best-score">0</span></p>
      <div class="buttons">
        <button type="button" id="again-button">Play again</button>
        <button type="button" id="next-button" hidden>Next level</button>
      </div>
    </div>
  </div>

  <div class="banner" id="level-banner" role="status" hidden></div>

  <script type="module" src="game.js"></script>
</body>
</html>
